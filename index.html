const Storage=(()=>{let db,queue=Promise.resolve();return{async open(){db=await new Promise((resolve,reject)=>{const r=indexedDB.open('EMR_Touch_Board_v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('workspace');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('Feche outras versões deste aplicativo e recarregue.'))});return await new Promise((resolve,reject)=>{const r=db.transaction('workspace').objectStore('workspace').get('main');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})},save(value){const snapshot=clone(value);queue=queue.catch(()=>{}).then(()=>new Promise((resolve,reject)=>{const tx=db.transaction('workspace','readwrite');tx.objectStore('workspace').put(snapshot,'main');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Gravação interrompida'))}));return queue},flush(){return queue},get db(){return db}}})();
const State={data:null,step:0,selectedDemand:null,workView:'flow',flowKind:'asis',tieSelected:null,reviewUnlocked:false,dirty:false,revision:0,savedRevision:0,modalSave:null,modalCleanup:null,filter:'',statusFilter:'',expanded:new Set(),session(){return this.data.sessions.find(x=>x.id===this.data.activeSessionId)},people(){const ids=this.session().participantIds;return this.data.participants.filter(x=>ids.includes(x.id))},demands(){const ids=this.session().demandIds;return this.data.demands.filter(x=>ids.includes(x.id))},cycle(){return this.data.cycles.find(x=>x.id===this.session().selectedCycleId)},demand(){return this.data.demands.find(x=>x.id===this.cycle()?.demandId)},review(){return this.cycle()?.review||this.session().review},historySource(){const{sessions,participants,demands,cycles,activeSessionId}=this.data;return clone({sessions,participants,demands,cycles,activeSessionId})}};
const newReview=()=>({fields:Object.fromEntries(ReviewFields.map(([id])=>[id,''])),include:Array(14).fill(true)});
function newSession(title='Encontro de Melhoria & Automação',date=Utils.date()){return{id:uid(),title,date,createdAt:now(),participantIds:[],demandIds:[],selectedCycleId:null,review:newReview(),pinHash:null}}
function seed(){const s=newSession();return{format:'emr-touch-board',version:3,activeSessionId:s.id,sessions:[s],participants:[],demands:[],cycles:[],undo:[],audit:[],updatedAt:now(),ui:{sidebarCollapsed:false,density:'compact'}}}
const Feedback=(()=>{let timer;return{toast(message,undo=false){clearTimeout(timer);$('#notices').innerHTML=`<div class="toast" role="status"><span>${esc(message)}</span>${undo?button('undo','Desfazer'):button('dismiss',icon('close'),'icon','aria-label="Fechar aviso"')}</div>`;timer=setTimeout(()=>$('#notices').replaceChildren(),undo?9000:5000)},save(status,error=false){const el=$('#saveIndicator');el.textContent=status;el.classList.toggle('error',error)}}})();
const History={commit(label,mutate,demandId=null){const snap=State.historySource();State.data.undo.push({label,at:now(),snapshot:snap});if(State.data.undo.length>30)State.data.undo.shift();mutate();const at=now();State.data.updatedAt=at;State.data.audit.push({id:uid(),sessionId:State.session().id,at,label,demandId});if(demandId){const d=State.data.demands.find(x=>x.id===demandId);if(d){d.updatedAt=at;const previous=snap.demands.find(x=>x.id===demandId);const changes={};for(const key of ['area','title','description','ratings','status','tieOrder'])if(JSON.stringify(previous?.[key])!==JSON.stringify(d[key]))changes[key]={before:previous?.[key]??null,after:clone(d[key])};d.history.push({at,label,changes})}}this.persist();Render.header()},persist(){const revision=++State.revision;State.dirty=true;Feedback.save('Salvando…');Storage.save(State.data).then(()=>{State.savedRevision=Math.max(State.savedRevision,revision);if(State.savedRevision===State.revision){State.dirty=false;Feedback.save('Salvo · neste navegador')}}).catch(e=>{Feedback.save('Falha ao salvar · exporte um backup',true);Feedback.toast('Falha no armazenamento: '+e.message)})},undo(){if(Pointers.active.size||Gestures.pending.size)return Feedback.toast('Finalize os toques antes de desfazer.');const action=State.data.undo.pop();if(!action)return Feedback.toast('Não há ação para desfazer.');Object.assign(State.data,clone(action.snapshot));State.data.audit.push({id:uid(),at:now(),sessionId:State.session().id,label:'Desfeito: '+action.label});this.persist();Dialog.close();Render.header();Render.page();Feedback.toast('Desfeito: '+action.label)}};
const Dialog={open(title,body,footer='',save=null){TouchKeyboard.hide();if(State.modalCleanup)State.modalCleanup();State.modalCleanup=null;const m=$('#modal');if(m.open)m.close();m.innerHTML=`<form id="modalForm"><div class="modal-head"><h2 id="modalTitle">${title}</h2>${button('modal-close',icon('close'),'icon','aria-label="Fechar janela" type="button"')}</div><div class="modal-body">${body}<div class="modal-error" id="modalError" role="alert"></div></div>${footer?`<div class="modal-foot">${footer}</div>`:''}</form>`;State.modalSave=save;m.showModal();requestAnimationFrame(()=>m.querySelector('input:not([type=checkbox]),textarea,select,button')?.focus())},close(){TouchKeyboard.hide();if(State.modalCleanup)State.modalCleanup();State.modalCleanup=null;$('#modal').close();State.modalSave=null},error(s){$('#modalError').textContent=s},confirm(title,text,fn,label='Confirmar',danger=false){this.open(title,`<p>${esc(text)}</p>`,button('modal-close','Voltar','','type="button"')+`<button class="${danger?'danger':'primary'}" type="submit">${label}</button>`,()=>{fn();this.close()})}};

const areaField=(value='')=>field('area','Área',value,'text',true,'maxlength="100" list="areas"')+`<datalist id="areas">${['ASGP','DCMD','DEOP','DESC',...new Set(State.people().map(x=>x.area))].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`;

const Classification={complete:d=>d.ratings.every(n=>Number.isInteger(n)&&n>=0&&n<=5),score:d=>d.ratings.reduce((s,n,i)=>s+(n===null?0:n/5*Criteria[i][1]),0),set(id,index,value){const d=State.data.demands.find(x=>x.id===id);if(!d)return;History.commit('Nota de '+Criteria[index][0]+': '+(value===null?'não respondido':value),()=>{d.ratings[index]=value;State.demands().forEach(x=>x.tieOrder=null);if(['Mapeada','Classificada'].includes(d.status))d.status=this.complete(d)?'Classificada':'Mapeada'},id);Render.classifyDetail();Render.classifyList();Render.navigation()},next(){const list=State.demands(),current=list.find(x=>x.id===State.selectedDemand);if(!current||!this.complete(current))return Feedback.toast('Responda os seis critérios, incluindo notas zero quando aplicável.');const index=list.indexOf(current);const next=[...list.slice(index+1),...list.slice(0,index)].find(d=>!this.complete(d));if(next){State.selectedDemand=next.id;Render.classifyDetail();Render.classifyList();Feedback.toast('Avaliação salva. Próxima demanda.')}else{Feedback.toast('Todas as demandas foram classificadas.');Navigation.go(3)}}};
const Ranking={sort(list){return [...list].sort((a,b)=>Classification.score(b)-Classification.score(a)||(b.ratings[0]??-1)-(a.ratings[0]??-1)||(b.ratings[4]??-1)-(a.ratings[4]??-1)||(a.tieOrder??999999)-(b.tieOrder??999999)||a.createdAt.localeCompare(b.createdAt))},equal(a,b){return a&&b&&Classification.complete(a)&&Classification.complete(b)&&Classification.score(a)===Classification.score(b)&&a.ratings[0]===b.ratings[0]&&a.ratings[4]===b.ratings[4]},tieGroups(){const sorted=this.sort(State.demands().filter(d=>d.status!=='Arquivada'&&Classification.complete(d))),groups=[];for(const d of sorted){const g=groups.find(g=>this.equal(g[0],d));if(g)g.push(d);else groups.push([d])}return groups.filter(g=>g.length>1)},topTies(){const a=this.sort(State.demands().filter(x=>x.status!=='Arquivada'));return a.filter(d=>this.equal(a[0],d))},choose(id){const list=this.sort(State.demands().filter(x=>x.status!=='Arquivada'));const d=State.data.demands.find(x=>x.id===id)||list[0];if(!d||!Classification.complete(d))return Feedback.toast('Conclua a classificação da demanda.');const incompletes=State.demands().filter(x=>x.status!=='Arquivada'&&!Classification.complete(x));Dialog.confirm('Confirmar demanda escolhida',`${d.title}. Será aberto um novo ciclo de trabalho; as outras demandas continuam no backlog.${incompletes.length?' Atenção: '+incompletes.length+' demanda(s) ainda sem classificação completa.':''}`,()=>this.start(d),'Confirmar e iniciar')},start(d){const existing=State.cycle();History.commit('Demanda escolhida para novo ciclo',()=>{if(existing&&existing.demandId!==d.id){const previous=State.data.demands.find(x=>x.id===existing.demandId);if(previous?.status==='Selecionada')previous.status='Em desenvolvimento'}const cycle={id:uid(),demandId:d.id,sessionId:State.session().id,selectedAt:now(),evaluation:{ratings:clone(d.ratings),score:Classification.score(d)},flows:{asis:{nodes:[],edges:[],view:{x:40,y:40,z:1}},tobe:{nodes:[],edges:[],view:{x:40,y:40,z:1}}},tasks:[],review:newReview()};cycle.review.fields.area=d.area;cycle.review.fields.problem=d.description;State.data.cycles.push(cycle);State.session().selectedCycleId=cycle.id;if(!State.session().demandIds.includes(d.id))State.session().demandIds.push(d.id);d.status='Selecionada';d.selections.push({at:cycle.selectedAt,sessionId:cycle.sessionId,cycleId:cycle.id,ratings:clone(d.ratings),score:Classification.score(d)})},d.id);State.workView='flow';State.flowKind='asis';Navigation.go(4);Feedback.toast('Demanda confirmada. Novo ciclo pronto.',true)}};
const Participants={open(id=null){const p=State.data.participants.find(x=>x.id===id);Dialog.open(p?'Editar participante':'Adicionar participante',field('name','Nome',p?.name,'text',true,'maxlength="150"')+areaField(p?.area)+selectField('status','Presença',['Prevista','Presente','Ausente','Inativa'],p?.status||'Presente'),(p?button('person-delete',icon('trash')+'Excluir','danger',`type="button" data-id="${p.id}"`):'')+saveFooter(),()=>{const v=formValues();if(!v.name.trim()||!v.area.trim())return Dialog.error('Preencha nome e área.');History.commit(p?'Participante atualizado':'Participante cadastrado',()=>{if(p)Object.assign(p,{name:v.name.trim(),area:v.area.trim(),status:v.status,updatedAt:now()});else{const n={id:uid(),name:v.name.trim(),area:v.area.trim(),status:v.status,createdAt:now(),updatedAt:now()};State.data.participants.push(n);State.session().participantIds.push(n.id)}});Dialog.close();Render.page();Feedback.toast('Participante salvo.',true)})},linked(id){return State.data.cycles.some(c=>c.tasks.some(t=>t.assignees.includes(id)))||State.data.audit.some(x=>x.participantId===id&&x.linked)},remove(id){const p=State.data.participants.find(x=>x.id===id);if(this.linked(id))return Dialog.confirm('Preservar histórico','Esta pessoa já foi vinculada a uma atividade. Ela será marcada como inativa e continuará no histórico.',()=>{History.commit('Participante inativado',()=>p.status='Inativa');Render.page()},'Marcar como inativa');Dialog.confirm('Excluir participante?',p.name+' será removido do cadastro desta sessão.',()=>{History.commit('Participante excluído',()=>{State.data.participants=State.data.participants.filter(x=>x.id!==id);State.data.sessions.forEach(s=>s.participantIds=s.participantIds.filter(x=>x!==id))});Render.page()},'Excluir',true)},copy(){const ss=State.data.sessions.filter(s=>s.id!==State.session().id&&s.participantIds.length);Dialog.open('Copiar participantes de outra sessão',ss.length?`<div class="selection-list">${ss.map(s=>button('copy-people-ses open(id=null,pos=null){const n=this.get().nodes.find(n=>n.id===id);const bounds=$('#flowCanvas').getBoundingClientRect();let p=pos||this.point(bounds.left+120,bounds.top+100);if(!n&&!pos){const base=clone(p),cols=Math.max(1,Math.floor((bounds.width/this.viewport.z-150)/264));for(let i=0;i<200;i++){const q={x:base.x+(i%cols)*264,y:base.y+Math.floor(i/cols)*176};if(!this.get().nodes.some(n=>Math.abs(n.x-q.x)<248&&Math.abs(n.y-q.y)<152)){p=q;break}}}Dialog.open(n?'Editar elemento':'Novo item no fluxo',field('title','Texto do elemento',n?.title,'text',true,'maxlength="500"')+selectField('type','Tipo',[['step','Etapa'],['start','Início / fim'],['decision','Decisão'],['note','Observação']],n?.type||'step'),(n?button('node-to-task','Criar atividade a partir desta etapa','','type="button" data-id="'+n.id+'"')+button('node-delete',icon('trash'),'danger icon',`type="button" data-id="${n.id}" aria-label="Excluir elemento"`):'')+saveFooter(),()=>{const v=formValues();if(!v.title.trim())return Dialog.error('Informe o texto do elemento.');History.commit(n?'Elemento do fluxo editado':'Elemento criado no fluxo '+State.flowKind.toUpperCase(),()=>{if(n)Object.assign(n,{title:v.title.trim(),type:v.type});else this.get().nodes.push({id:uid(),title:v.title.trim(),type:v.type,x:Math.max(0,Math.min(4776,p.x)),y:Math.max(0,Math.min(2872,p.y))})},State.demand().id);Dialog.close();this.renderNodes();this.lines();Feedback.toast('Elemento salvo.',true)})},

edit(isNew=false){const s=State.session();Dialog.open(isNew?'Criar nova sessão':'Identificação do encontro',field('title','Título do encontro',isNew?'':s.title,'text',true,'maxlength="250"')+field('date','Data',isNew?Utils.date():s.date,'date',true),saveFooter(isNew?'Criar sessão':'Salvar encontro'),()=>{const v=formValues();if(!v.title.trim()||!v.date)return Dialog.error('Preencha título e data.');Facilitator.flush();History.commit(isNew?'Nova sessão criada':'Identificação do encontro atualizada',()=>{if(isNew){const n=newSession(v.title.trim(),v.date);State.data.sessions.push(n);State.data.activeSessionId=n.id}else Object.assign(s,{title:v.title.trim(),date:v.date})});Dialog.close();if(isNew){State.step=0;State.reviewUnlocked=false;State.selectedDemand=null}Render.header();Render.page();Feedback.toast(isNew?'Sessão criada. Cadastre ou copie os participantes.':'Encontro atualizado.',true)})},
select(id){Facilitator.flush();History.commit('Sessão aberta',()=>State.data.activeSessionId=id);State.step=0;State.reviewUnlocked=false;State.selectedDemand=null;Dialog.close();Render.header();Render.page()},
cycles(demandId=null){const cs=[...State.data.cycles].filter(c=>!demandId||c.demandId===demandId).sort((a,b)=>b.selectedAt.localeCompare(a.selectedAt));Dialog.open('Histórico de ciclos de trabalho',`<div class="selection-list">${cs.map(c=>{const d=State.data.demands.find(x=>x.id===c.demandId),s=State.data.sessions.find(x=>x.id===c.sessionId);return button('cycle-open',`<span><b>${esc(d.title)}</b><small style="display:block">${fmt(c.selectedAt)} · ${esc(s.title)} · ${c.tasks.length} atividades</small></span>${icon('arrow')}`,'',`type="button" data-id="${c.id}"`)}).join('')||'<p>Nenhum ciclo registrado.</p>'}</div>`,button('modal-close','Fechar','','type="button"'))},
openCycle(id){const c=State.data.cycles.find(x=>x.id===id);History.commit('Ciclo anterior aberto',()=>{State.data.activeSessionId=c.sessionId;State.session().selectedCycleId=c.id});State.reviewUnlocked=false;Dialog.close();State.step=4;State.workView='flow';State.flowKind='asis';Render.header();Render.page()}
};
function demandStatus(id){const d=State.data.demands.find(x=>x.id===id);Dialog.open('Status da demanda',`<h3>${esc(d.title)}</h3>`+selectField('status','Situação',Statuses,d.status),saveFooter(),()=>{const v=formValues();if(v.status==='Classificada'&&!Classification.complete(d))return Dialog.error('Responda os seis critérios antes de marcar como classificada.');History.commit('Status da demanda: '+v.status,()=>d.status=v.status,id);Dialog.close();Render.page();Feedback.toast('Status atualizado.',true)})}
function demandHistory(id){const d=State.data.demands.find(x=>x.id===id);Dialog.open('Histórico da demanda',`<h3>${esc(d.title)}</h3><p class="muted">Origem: ${esc(State.data.sessions.find(x=>x.id===d.originSessionId)?.title||'—')} · ${fmt(d.createdAt)}</p><h3>Escolhas e ciclos</h3><ol class="history-list">${d.selections.map(x=>`<li>${new Date(x.at).toLocaleString('pt-BR')} · ${esc(State.data.sessions.find(s=>s.id===x.sessionId)?.title||'—')}</li>`).join('')||'<li>Ainda não selecionada.</li>'}</ol><h3>Alterações registradas</h3><ol class="history-list">${[...d.history].reverse().map(x=>`<li>${new Date(x.at).toLocaleString('pt-BR')} · ${esc(x.label)}${x.changes&&Object.keys(x.changes).length?`<div class="hint" style="margin:8px 0">${Object.entries(x.changes).map(([key,v])=>`<p><b>${esc(({area:'Área',title:'Título',description:'Descrição',ratings:'Notas',status:'Status',tieOrder:'Desempate'})[key]||key)}:</b> ${esc(Array.isArray(v.before)?v.before.map(n=>n===null?'vazio':n).join(', '):v.before??'—')} → ${esc(Array.isArray(v.after)?v.after.map(n=>n===null?'vazio':n).join(', '):v.after??'—')}</p>`).join('')}</div>`:''}</li>`).join('')||'<li>Sem alterações registradas.</li>'}</ol>`,button('modal-close','Fechar','','type="button"'))}
function dataMenu(){Dialog.open('Dados e recuperação',`<div class="hint">Todas as ações são salvas no IndexedDB deste navegador. Use o backup JSON para transferir os dados para outro computador ou recuperar a base após limpar o navegador.</div><p><b>Base atual:</b> ${State.data.sessions.length} sessões · ${State.data.demands.length} demandas · ${State.data.cycles.length} ciclos</p><div class="stack">${button('export-all',icon('download')+'Exportar backup completo','primary','type="button"')}${button('export-session',icon('download')+'Exportar sessão e histórico vinculado','','type="button"')}${button('import-open',icon('upload')+'Importar JSON v3','','type="button"')}</div><small>A exportação da sessão inclui as sessões de origem e os ciclos das demandas vinculadas, para manter referências e histórico. A importação valida os dados antes de adicionar ou substituir.</small>`,button('modal-close','Fechar','','type="button"'))}
function help(){Dialog.open('Como conduzir o encontro',`<div class="stack"><p><b>1. Prepare.</b> Crie a sessão e cadastre participantes. O botão no topo mantém a lista acessível em todas as etapas.</p><p><b>2. Mapeie e avalie.</b> Registre área, título e descrição. Avalie os seis critérios de 0 a 5. Zero vale como resposta; vazio não vale.</p><p><b>3. Decida.</b> Confirme a primeira demanda no ranking. Empates por pontuação, Impacto e Viabilidade exigem decisão do grupo.</p><p><b>Teclado no touch.</b> Toque em um campo de texto para abrir o teclado compacto. Arraste o cabeçalho para reposicioná-lo; use áé para acentos, 123 para números e OK para o próximo campo. Ele não abre com mouse e fecha ao usar o teclado físico. Campos de data e listas mantêm os controles nativos.</p><p><b>Mais espaço.</b> Use o botão de menu no canto superior esquerdo para recolher ou abrir a navegação. Na área de trabalho, Detalhes reúne status, histórico de ciclos e revisão do facilitador.</p><p><b>4. Desenhe o processo.</b> No fluxo, toque em Novo item ou segure o fundo por 0,5 s. Arraste os elementos e conecte os pontos azuis. Toque na conexão para editar. Desloque o fundo com um dedo; use dois dedos para zoom. O botão de porcentagem enquadra o fluxo.</p><p><b>5. Execute.</b> No Kanban, Novo post-it pede só o título. Toque no card para detalhes. Segure o card parado por 0,5 s até o aviso de arraste e mova-o. Arraste uma pessoa da lista para adicionar. Cada responsável vira uma etiqueta abaixo do título: arraste-a para outro card para mover ou para fora de todos os cards para retirar o vínculo. Um toque na etiqueta também abre as opções.</p><p><b>6. Use gestos com intenção.</b> Desenhe ✓ com um traço de baixo para cima à direita, sem pausar. Para cancelar, desenhe dois traços diagonais cruzados em até 0,75 s entre eles. Faça o gesto dentro do card, com pelo menos 45 px de largura e 30 px de altura. Para avançar ou voltar uma coluna, desenhe uma seta → ou ← em dois traços: uma haste horizontal e, em seguida, a ponta em forma de &gt; ou &lt;, dentro do card. Um simples risco ou deslize não move a atividade. Não há traço visível nem notificação. Traços ambíguos não alteram a atividade. Use Desfazer se necessário.</p><p><b>7. Revise e compartilhe.</b> Consolide as informações no modo do facilitador, selecione as seções e use Imprimir / PDF. Na janela do navegador, escolha Salvar como PDF e papel A4; desative cabeçalhos e rodapés do navegador se desejar.</p><p><b>8. Continue.</b> O backlog mantém todas as demandas. Iniciar novo ciclo preserva os ciclos e a avaliação anterior.</p><div class="hint">Multitoque depende da tela e do navegador. Cada card aceita uma pessoa por vez; cards diferentes podem ser manipulados simultaneamente. Teste os gestos na tela física antes da reunião.</div><p class="muted">Abra este HTML diretamente em um navegador atualizado com IndexedDB (Edge, Chrome ou Firefox). Use o mesmo navegador e mantenha o arquivo no mesmo local para retomar a base. No modo privado, os dados podem ser apagados ao fechar. Exporte um backup JSON ao final do encontro.</p></div>`,button('modal-close','Entendi','primary','type="button"'))}

 'assignee-options':b=>{if(performance.now()<Number(b.dataset.suppressClickUntil||0))return;Kanban.assigneeOptions(b.dataset.assigneePerson,b.dataset.assigneeTask)},'assignee-remove':b=>{Kanban.transferAssignee(b.dataset.person,b.dataset.task);Dialog.close()},

'fullscreen':async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else Feedback.toast('Tela cheia indisponível. Use F11 no navegador.')}catch(e){Feedback.toast('Use F11 para ativar tela cheia neste navegador.')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(Pointers.active.size||Gestures.pending.size){if(!['dismiss','fullscreen'].includes(action))return Feedback.toast('Finalize os toques antes desta ação.')}if(Commands[action]){try{const result=Commands[action](b);if(result?.catch)result.catch(err=>Feedback.toast(err.message))}catch(err){console.error(err);Feedback.toast('Não foi possível concluir: '+err.message)}}});
$('#modal').addEventListener('submit',e=>{e.preventDefault();if(!$('#modalForm').reportValidity())return;try{State.modalSave?.()}catch(err){console.error(err);Dialog.error(err.message)}});
$('#modal').addEventListener('cancel',()=>{TouchKeyboard.hide();if(State.modalCleanup)State.modalCleanup();State.modalSave=null});
$('#importFile').addEventListener('change',e=>Transfer.read(e.target.files[0]));
document.addEventListener('input',e=>{if(e.target.id==='backlogSearch'){State.filter=e.target.value;Render.backlogResults()}});
document.addEventListener('change',e=>{if(e.target.id==='backlogStatus'){State.statusFilter=e.target.value;Render.backlogResults()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.target.closest('button,input,textarea,select')&&!$('#modal').open){const node=e.target.closest('[data-node-id]'),task=e.target.closest('[data-task-id]'),edge=e.target.closest('[data-edge-id]');if(Pointers.active.size||Gestures.pending.size)return;if(node){e.preventDefault();Flow.open(node.dataset.nodeId)}else if(task){e.preventDefault();Kanban.open(task.dataset.taskId)}else if(edge){e.preventDefault();Flow.edgeOpen(edge.dataset.edgeId)}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea')){e.preventDefault();History.undo()}});
window.addEventListener('resize',()=>{if(State.step===4){if(State.workView==='flow')Flow.resize();else Kanban.resize()}});
window.addEventListener('beforeunload',e=>{Facilitator.flush();if(State.dirty){e.preventDefault();e.returnValue='Há alterações aguardando salvamento.'}});
window.addEventListener('beforeprint',()=>{TouchKeyboard.hide();Facilitator.flush();if(State.step!==6){State.beforePrintStep=State.step;State.step=6;Render.navigation();Render.page()}});
window.addEventListener('afterprint',()=>{if(State.beforePrintStep!==undefined){State.step=State.beforePrintStep;delete State.beforePrintStep;Render.navigation();Render.page()}});
async function boot(){for(const[id,name]of [['menuToggle','panel'],['densityIcon','zoom'],['peopleIcon','people'],['undoBtn','undo'],['sessionsIcon','folder'],['dataBtn','download'],['fullscreenBtn','expand']])$('#'+id).innerHTML=icon(name);try{const stored=await Storage.open();State.data=stored?Transfer.validate(stored):seed();if(!stored)await Storage.save(State.data);Render.header();Render.page();Feedback.save('Salvo · neste navegador');TouchKeyboard.init();Pointers.init();navigator.storage?.persist?.().catch(()=>{})}catch(e){console.error(e);Feedback.save('Armazenamento indisponível',true);$('#content').innerHTML=`<div class="fatal"><h1>Não foi possível abrir a base local</h1><p style="margin:20px 0">${esc(e.message)}</p><p>Abra o arquivo em um navegador com IndexedDB habilitado, permita o armazenamento local e recarregue. Os dados existentes não foram sobrescritos.</p><p style="margin-top:20px">Se o problema for um backup, importe um JSON v3 validado após recuperar o acesso ao armazenamento.</p></div>`}}
boot();
